<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
				<title>Royal Buddies</title>
				<style>
					* { box-sizing: border-box; }
					html, body {
					margin: 0;
					width: 100%;
					height: 100%;
					overflow: hidden;
					background: #101b21;
					}
					#unity-canvas {
					display: block;
					width: 100%;
					height: 100%;
					background: #101b21;
					}
					#loading {
					position: fixed;
					inset: 0;
					z-index: 10;
					background: #101b21 url("TemplateData/RB_loading_screen.png")
					center center / contain no-repeat;
					display: flex;
					align-items: flex-end;
					justify-content: center;
					padding-bottom: max(8vh, 35px);
					transition: opacity 0.5s ease;
					}
					#progress-container {
					width: min(75%, 340px);
					text-align: center;
					color: white;
					font: bold 15px Arial, sans-serif;
					text-shadow: 0 2px 5px #000;
					}
					#progress-track {
					height: 18px;
					border: 2px solid #d8ad52;
					border-radius: 12px;
					overflow: hidden;
					background: #18252b;
					margin-bottom: 10px;
					}
					#progress-bar {
					width: 0%;
					height: 100%;
					background: linear-gradient(90deg, #2c9e77, #80e6b5);
					transition: width .15s ease;
					}
				</style>
			</head>
	<body>
		<canvas id="unity-canvas" tabindex="-1"></canvas>

		<div id="loading">
			<div id="progress-container">
				<div id="progress-track">
					<div id="progress-bar"></div>
				</div>
				<span id="progress-text">Chargement... 0%</span>
			</div>
		</div>

		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
			const canvas = document.querySelector("#unity-canvas");
			const loading = document.querySelector("#loading");
			const bar = document.querySelector("#progress-bar");
			const label = document.querySelector("#progress-text");

			const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

			if (mobile) {
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			} else {
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			}
			const debutChargement = performance.now();
			createUnityInstance(canvas, {
			arguments: [],
			dataUrl: "Build/{{{ DATA_FILENAME }}}",
			frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
			codeUrl: "Build/{{{ CODE_FILENAME }}}",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "Royal Buddies",
			productName: "Royal Buddies",
			productVersion: "0.1.0"
			}, function(progress) {
			const percent = Math.round(progress * 100);
			bar.style.width = percent + "%";
			label.textContent = "Chargement... " + percent + "%";
			}).then(async function() {
  const tempsEcoule = performance.now() - debutChargement;
  const attente = Math.max(0, 3000 - tempsEcoule);

  await new Promise(resolve => setTimeout(resolve, attente));

  bar.style.width = "100%";
  label.textContent = "Chargement... 100%";

  loading.style.opacity = "0";

  setTimeout(function() {
    loading.style.display = "none";
  }, 500);
			
			}).catch(function(error) {
			label.textContent = "Erreur de chargement";
			console.error(error);
			});
		</script>
	</body>
</html>
