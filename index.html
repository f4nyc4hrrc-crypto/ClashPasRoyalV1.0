<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
<title>Royal Buddies V8.6.1 — Fluide</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050a14}body{touch-action:none}#canvas{display:block;width:100%;height:100%;outline:none}
#rb-loader{position:fixed;inset:0;z-index:9999;background:#050a14 url('loading_screen.png') center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;font-family:Arial,sans-serif;transition:opacity .35s ease}
#rb-bottom{width:min(82vw,620px);margin-bottom:max(5vh,28px);text-align:center;padding:18px 16px 22px;background:rgba(4,9,18,.58);border-radius:18px;backdrop-filter:blur(4px)}
#rb-track{height:22px;background:#142234;border:4px solid #e7b83d;border-radius:14px;box-shadow:0 3px 0 #6f4312,inset 0 0 0 2px #111b27;overflow:hidden}
#rb-fill{height:100%;width:0%;background:linear-gradient(#48c9ff,#168de9);transition:width .12s linear}
#rb-pct{color:white;font-size:28px;font-weight:900;margin-top:10px;text-shadow:0 3px 2px #000}
#rb-status{color:#d9e9ff;font-size:13px;font-weight:700;margin-top:4px;letter-spacing:.08em}
#rb-start{display:none;color:#fff;font-size:24px;font-weight:900;letter-spacing:.06em;padding:12px 4px;text-shadow:0 3px 3px #000;animation:rbPulse 1.15s ease-in-out infinite alternate}
@keyframes rbPulse{from{opacity:.58;transform:scale(.98)}to{opacity:1;transform:scale(1.025)}}
</style>
</head>
<body>
<audio id="rb-menu-music" src="Champ%20de%20Duel.mp3" preload="auto" loop></audio>
<audio id="rb-battle-music" src="Victoire%20Rapide.mp3" preload="auto" loop></audio>
<canvas id="canvas">Votre navigateur ne prend pas en charge Canvas.</canvas>
<div id="rb-loader"><div id="rb-bottom"><div id="rb-track"><div id="rb-fill"></div></div><div id="rb-pct">0%</div><div id="rb-status">CHARGEMENT…</div><div id="rb-start">TOUCHEZ POUR COMMENCER</div></div></div>
<script src="index.js"></script>
<script>
const menuMusic=document.getElementById('rb-menu-music');
const battleMusic=document.getElementById('rb-battle-music');
let rbMusicVolume=parseFloat(localStorage.getItem('rb_music_volume') ?? '0.36');
if(!Number.isFinite(rbMusicVolume)) rbMusicVolume=.36;
rbMusicVolume=Math.max(0,Math.min(1,rbMusicVolume));
let rbSfxVolume=parseFloat(localStorage.getItem('rb_sfx_volume') ?? '0.80');
if(!Number.isFinite(rbSfxVolume)) rbSfxVolume=.80;
rbSfxVolume=Math.max(0,Math.min(1,rbSfxVolume));
menuMusic.volume=rbMusicVolume; battleMusic.volume=rbMusicVolume;
window.rbSetMusicVolume=(v)=>{rbMusicVolume=Math.max(0,Math.min(1,Number(v)||0));menuMusic.volume=rbMusicVolume;battleMusic.volume=rbMusicVolume;localStorage.setItem('rb_music_volume',String(rbMusicVolume));};
window.rbSetSfxVolume=(v)=>{rbSfxVolume=Math.max(0,Math.min(1,Number(v)||0));localStorage.setItem('rb_sfx_volume',String(rbSfxVolume));};
let musicUnlocked=false;
function safePlay(a){ const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }
window.rbMusicMenu=()=>{battleMusic.pause();battleMusic.currentTime=0;safePlay(menuMusic);};
window.rbMusicBattle=()=>{menuMusic.pause();menuMusic.currentTime=0;safePlay(battleMusic);};
function unlockMusic(){if(musicUnlocked)return;musicUnlocked=true;safePlay(menuMusic);}
// iOS/Safari peut bloquer l'autoplay : on tente immédiatement, puis au premier toucher/clic.
safePlay(menuMusic);
['touchstart','pointerdown','click','keydown'].forEach(e=>window.addEventListener(e,unlockMusic,{once:true,passive:true}));

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29037636,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);
const fill=document.getElementById('rb-fill'),pct=document.getElementById('rb-pct'),loader=document.getElementById('rb-loader');
const track=document.getElementById('rb-track'),status=document.getElementById('rb-status'),startPrompt=document.getElementById('rb-start');
let gameReady=false, entering=false;
function progress(current,total){let p=total>0?Math.round(current/total*100):0;p=Math.max(0,Math.min(100,p));fill.style.width=p+'%';pct.textContent=p+'%';}
function showStartPrompt(){
  gameReady=true;
  track.style.display='none'; pct.style.display='none'; status.style.display='none';
  startPrompt.style.display='block';
}
function enterGame(){
  if(!gameReady||entering)return;
  entering=true;
  unlockMusic();
  loader.style.opacity='0';
  setTimeout(()=>loader.remove(),380);
}
['touchend','pointerup','click'].forEach(e=>loader.addEventListener(e,enterGame,{passive:true}));
engine.startGame({onProgress:progress}).then(()=>{fill.style.width='100%';pct.textContent='100%';setTimeout(showStartPrompt,120)}).catch(err=>{status.textContent='ERREUR DE CHARGEMENT';console.error(err)});
</script>
</body>
</html>
